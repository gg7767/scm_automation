{% for result in results %}
<div class="px-3 py-2 hover:bg-slate-50 cursor-pointer text-sm border-b border-slate-100 last:border-0"
     onclick="selectPOItem('{{ result.item.pk }}', '{{ result.item.name|escapejs }}', '{{ result.rate|default:"" }}', '{{ result.item.gst_rate }}')">
    <div class="font-medium text-slate-900">{{ result.item.name }}</div>
    <div class="text-xs text-slate-500">
        {{ result.item.code }} &middot; {{ result.item.get_unit_display }} &middot; GST {{ result.item.gst_rate }}%
        {% if result.rate %}&middot; contract rate ₹{{ result.rate }}{% endif %}
    </div>
</div>
{% empty %}
<div class="px-3 py-2 text-sm text-slate-400">No matching items.</div>
{% endfor %}
