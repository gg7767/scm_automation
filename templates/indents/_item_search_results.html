{% for item in items %}
<div class="px-3 py-2 hover:bg-slate-50 cursor-pointer text-sm border-b border-slate-100 last:border-0"
     onclick="selectIndentItem('{{ item.pk }}', '{{ item.name|escapejs }}')">
    <div class="font-medium text-slate-900">{{ item.name }}</div>
    <div class="text-xs text-slate-500">{{ item.code }} &middot; {{ item.get_unit_display }}</div>
</div>
{% empty %}
<div class="px-3 py-2 text-sm text-slate-400">No matching items.</div>
{% endfor %}
