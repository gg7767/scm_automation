{% for item in items %}
<div class="px-3 py-2 hover:bg-slate-100 cursor-pointer text-sm border-b border-slate-100 last:border-0"
     onclick="selectIndentItem('{{ item.id }}', '{{ item.name|escapejs }}', '{{ item.unit|escapejs }}', '{{ item.stock }}')">
    <div class="font-medium text-slate-900">{{ item.name }}</div>
    <div class="text-xs text-slate-500">{{ item.code }} &middot; {{ item.unit_display }} &middot; Stock: {{ item.stock }}</div>
</div>
{% empty %}
<div class="px-3 py-2 text-sm text-slate-400">No matching items found. Continue typing to create as a new item.</div>
{% endfor %}
